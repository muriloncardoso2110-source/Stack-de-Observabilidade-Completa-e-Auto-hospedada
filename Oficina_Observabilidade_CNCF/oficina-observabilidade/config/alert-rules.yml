groups:
  - name: oficina
    rules:
      - alert: AplicacaoForaDoAr
        expr: up{job="oficina-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "A aplicação de exemplo não está respondendo"
      - alert: TaxaAltaDeErros
        expr: sum(rate(oficina_http_requests_total{status=~"5.."}[2m])) / clamp_min(sum(rate(oficina_http_requests_total[2m])), 0.001) > 0.15
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Mais de 15% de erros HTTP 5xx nos últimos 2 minutos"
